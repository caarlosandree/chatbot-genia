# Development Profile

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST_DEV:localhost}:${DB_PORT_DEV:5432}/${DB_NAME_DEV:chatbot-dev}
spring.datasource.username=${DB_USER_DEV:postgres}
spring.datasource.password=${DB_PASSWORD_DEV:}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=${REDIS_HOST_DEV:localhost}
spring.data.redis.port=${REDIS_PORT_DEV:6379}
spring.data.redis.database=${REDIS_DB_DEV:0}
spring.data.redis.password=${REDIS_PASSWORD_DEV:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Flyway
spring.flyway.clean-on-validation-error=false

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

